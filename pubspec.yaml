name: claro
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  package_info_plus: ^8.0.0
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  google_sign_in: ^6.2.1
  http: ^1.2.2
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  shared_preferences: ^2.5.5

  cupertino_icons: ^1.0.8
  camera: ^0.10.6
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  image: ^4.2.0
  encrypt: ^5.0.3
  crypto: ^3.0.3

  # Module 5 logic and Gemini integration
  flutter_dotenv: ^5.1.0
  google_generative_ai: ^0.4.6
  provider: ^6.1.5+1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/CLAROappLogo.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/model/
    - .env

